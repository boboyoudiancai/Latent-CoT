run_id: QwenOFT_Libero_Qwen3-4B
run_root_dir: /home/liuyue/starVLA/playground/Checkpoints
seed: 42
wandb_entity: '2351563'
wandb_project: starVLA_Libero
is_debug: false
version_id: '0.21'
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /mnt/oss/liuyue/wangbo/models/models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: MLP
    action_dim: 7
    action_hidden_dim: 2560
    future_action_window_size: 7
    past_action_window_size: 0
    state_dim: 7
    action_horizon: 8
datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 10
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/oss/liuyue/wangbo/data/libero
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: Your task is {instruction}. To identify the key objects for your task.
      Locate their bounding boxes in [x1,y1,x2,y2] format.
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av
trainer:
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: true
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  vla_data:
    video_backend: torchvision_av
config_yaml: ./examples/LIBERO/train_files/starvla_cotrain_libero.yaml
output_dir: /home/liuyue/starVLA/playground/Checkpoints/QwenOFT_Libero_Qwen3-4B
