run_id: qwenpi_future_thinking_stage1
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla_future_libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /share/home/u25505/apps/wangbo/LatentVLA/LaRA-VLA/playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
    num_vl_layers: 36
  future:
    enable: true
    token: <future>
    token_count: 16
    loss_weight: 0.5
    use_teacher: true
    teacher_update_mode: ema
    ema_momentum: 0.999
    teacher_input_size: 112
    target_mode: residual_ema_rms
    loss_type: l2
    prediction_mlp_ratio: 2.0
    residual_ema_decay: 0.99
    residual_ema_eps: 1.0e-06
  latent_reasoning:
    enable: true
    stage: 1
    token_count: 3
    require_base_initialization: true
    decoder_base_vlm: /share/home/u25505/apps/wangbo/LatentVLA/LaRA-VLA/playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    decoder_micro_batch_size: 7
    decoder_loss_weight: 0.1
    max_target_tokens: 128
  spatial_forcing_aux:
    enable: true
    input_size: 518
    preprocess_mode: resize
    target_tokens: 64
    student_layer: 24
    teacher_layer: -1
    patch_start_idx: 5
    pooling_func: bilinear
    use_vggt_pe: true
    use_vlm_norm: true
    loss_weight: 0.5
    teacher_repo: /share/home/u25505/apps/wangbo/LatentVLA/LaRA-VLA/playground/Pretrained_models/VGGT-1B
    target_cache_size: 0
    target_cache_dir: null
    target_cache_only: false
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 4
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: false
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 4
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /share/home/u25505/apps/wangbo/starVLA/playground/Checkpoints/starvla_qwenpiv3_future_libero_direct_stage2_40k_20261029/data_overlay/libero_cot_primary_alias
    data_mix: libero_all
    action_type: delta_qpos
    include_state: false
    include_future: true
    include_thinking_annotations: true
    sampling_mode: lara_uniform_steps
    per_device_batch_size: 7
    load_all_data_for_training: true
    image_size: [224, 224]
    obs_image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  max_train_steps: 10000
  num_warmup_steps: 300
  save_interval: 1000
  eval_interval: 100000
  pretrained_checkpoint: null
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    project_layers: 1.0e-04
    latent_decoder: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  scale_scheduler_by_world_size: true
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.0
    fused: false
  repeated_diffusion_steps: 4
